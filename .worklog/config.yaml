projectName: Sorra Agents
prefix: SA
autoExport: true
autoSync: false
githubRepo: SorraTheOrc/SorraAgents
# Author-identity gate allow-list (SA-0MUJ2VMF7000UHCX): accepts commits
# authored by the project's GitHub identity in addition to the local
# user.email, so `wl sync` can merge worklog data pushed from the operator's
# GitHub-identity checkout. `pi@local` is the host framework identity used by
# agent checkouts, so their worklog-data commits merge too
# (SA-0MVGSB63F00803HK, SA-0MVB57M02008QPJS).
#
# This deliberately widens the project gate: a `pi@local`-authored sync commit
# is merged instead of stranding every local worklog mutation. The widening is
# bounded — the list stays exact-email (no allow-all, no wildcards), the
# empty-author-email gate is never bypassed, and incident sentinel identities
# such as `t@t.com` stay refused. Regression coverage:
# tests/test_author_gate_allowlist.py. See SA-0MVB57M02008QPJS.
#
# `sorra@thewizardscode.com` is the project's own work identity (not a
# sentinel): inbound worklog commits authored by it blocked `wl sync` on
# 2026-10-27 and again on 2026-10-29/10-31 (SA-0MVVX9PAT009Q45H, decision =
# allow-list the real project identity).
syncAllowedAuthors:
  - 250240+SorraTheOrc@users.noreply.github.com
  - pi@local
  - sorra@thewizardscode.com
