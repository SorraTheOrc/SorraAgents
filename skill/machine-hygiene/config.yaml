# Machine-Hygiene Skill — Threshold Configuration
#
# This file defines the thresholds used to classify performance metrics
# as low (green), warning (amber), or critical (red).
#
# All values are percentages or absolute numbers as noted.
# Edit this file to customise thresholds for your environment.
#
# Usage: load via scripts/config.py::load_config()

# ---------------------------------------------------------------------------
# CPU Pressure (from /proc/pressure/cpu, "some" line, avg10)
#   Percentage of the last 10 s during which *at least one* task was stalled
#   waiting for CPU. This is a stall percentage, NOT a utilisation figure.
#   The CPU pressure file exposes no "full" line on current kernels.
# ---------------------------------------------------------------------------
cpu_pressure:
  low: 0
  warning: 70     # >70% indicates moderate CPU contention
  critical: 85    # >85% indicates severe CPU starvation

# ---------------------------------------------------------------------------
# Memory Usage (from /proc/meminfo)
#   Percentage of RAM in use (total minus available). Distinct from
#   memory_pressure below: this is a capacity figure, not a stall signal.
# ---------------------------------------------------------------------------
memory_usage:
  low: 0
  warning: 80     # >80% memory used — moderate pressure
  critical: 95    # >95% memory used — imminent OOM risk

# ---------------------------------------------------------------------------
# Memory Pressure (from /proc/pressure/memory, "full" line, avg10)
#   Percentage of the last 10 s during which *all* tasks were stalled waiting
#   for memory. Deliberately much lower than memory_usage: a system can sit at
#   50% RAM and still stall for 20% of wall time under reclaim/refault churn,
#   and 95% RAM used with no stalls is not a memory *stall* problem. Usage % and
#   stall % are different quantities and are not comparable, so this metric has
#   its own block rather than borrowing memory_usage's 80/95 (which would leave
#   it permanently green now that parsing works).
# ---------------------------------------------------------------------------
memory_pressure:
  low: 0
  warning: 5     # >5% of wall time fully stalled on memory — reclaim churn
  critical: 20   # >20% fully stalled — severe reclaim/thrash, OOM risk

# ---------------------------------------------------------------------------
# I/O Pressure (from /proc/pressure/io, "full" line, avg10)
#   Percentage of the last 10 s during which *all* tasks were stalled on I/O.
# ---------------------------------------------------------------------------
io_pressure:
  low: 0
  warning: 50     # >50% I/O stalled — noticeable slowdown
  critical: 80    # >80% I/O stalled — near-dead system

# ---------------------------------------------------------------------------
# Load Average
#   Multiplier against core count for classification.
#   e.g. on a 16-core machine:
#     warning  = cores * 0.7 = 11.2
#     critical = cores * 1.5 = 24.0
# ---------------------------------------------------------------------------
load_average:
  low: 0
  warning_multiplier: 0.7   # warning = cores * 0.7
  critical_multiplier: 1.5  # critical = cores * 1.5

# ---------------------------------------------------------------------------
# Zombie Processes
#   Absolute count of zombie (defunct) processes.
# ---------------------------------------------------------------------------
zombie_processes:
  low: 0
  warning: 5    # >5 zombies — potential cleanup issue
  critical: 20  # >20 zombies — process-tree problem

# ---------------------------------------------------------------------------
# Swap Usage (percentage of swap space in use)
#   Swap is a HISTORICAL figure: pages accumulate over days of paging and
#   stay in swap after pressure has passed. The warning/critical levels below
#   are only applied when memory is under *current* pressure — either
#   memory_usage is at/above its own warning threshold, or the PSI memory
#   "full" line (memory_pressure) is at/above its warning threshold. Swap
#   above 30 % with memory_usage below 80 % and no memory stalls is reported
#   low (historical accumulation, not actionable). A warning-level swap
#   reading is escalated to critical when memory_usage is critical. If PSI
#   memory data is unavailable, the capacity figure (memory_usage) is the
#   sole signal.
# ---------------------------------------------------------------------------
swap_usage:
  low: 0
  warning: 30   # >30% swap used AND current memory pressure — moderate pressure
  critical: 70  # >70% swap used AND current memory pressure — severe

# ---------------------------------------------------------------------------
# Runnable Process Count
#   Number of processes in D (uninterruptible sleep) or R (runnable) state.
#   Warning when count exceeds core count * multiplier. This is scheduler
#   saturation, NOT total process count — do not reuse it for process_count.
# ---------------------------------------------------------------------------
runnable_processes:
  low: 0
  warning_multiplier: 2.0   # warning = cores * 2
  critical_multiplier: 4.0  # critical = cores * 4

# ---------------------------------------------------------------------------
# Process Count
#   Total processes across the host. On a multi-agent host each pi/herdr
#   session (plus its test/build children) legitimately adds dozens of
#   processes, so this is calibrated per core rather than as a single-user
#   absolute figure. Warning = cores * 48, critical = cores * 96.
#   e.g. on a 16-core host: warning 768, critical 1536 (a herdr host with
#   16-21 concurrent sessions runs ~520-580 processes at rest → green;
#   a genuine process explosion (>1536) still alarms).
#   Independently overridable — this block is separate from thread_count.
# ---------------------------------------------------------------------------
process_count:
  low: 0
  warning_multiplier: 48.0   # warning = cores * 48
  critical_multiplier: 96.0  # critical = cores * 96

# ---------------------------------------------------------------------------
# Thread Count
#   Total threads across all processes. Each pi/node agent session carries
#   ~100+ threads, so thread-heavy multi-agent hosts need a much higher
#   per-core allowance than process_count. Warning = cores * 160,
#   critical = cores * 320.
#   e.g. on a 16-core host: warning 2560, critical 5120 (16-21 sessions run
#   ~1700-2300 threads → green; a genuine thread explosion (>5120) still
#   alarms). Kept as its own block so it can be tuned independently of
#   process_count.
# ---------------------------------------------------------------------------
thread_count:
  low: 0
  warning_multiplier: 160.0   # warning = cores * 160
  critical_multiplier: 320.0  # critical = cores * 320

# ---------------------------------------------------------------------------
# Stale-lock detection (/var/lock)
#   A regular file in /var/lock counts as stale only when ALL of these hold:
#     1. it is not a known kernel-owned boot lock (asound.state.lock,
#        card0.lock, card1.lock, card2.lock — ALSA kernel locks present from
#        boot), and
#     2. it is not root-owned (root-owned locks are system/operator-managed),
#        and
#     3. it is older than 24 h (a recently touched lock is treated as active),
#        and
#     4. it records no live owning PID (a bare PID in the file whose /proc
#        entry exists means the lock is held).
#   Only genuinely stale locks feed the stale_lock_files metric and the
#   pressure-analysis prune proposal. actions.py additionally refuses to
#   remove stale locks automatically ("operator-managed"), as defence in
#   depth. The 24 h age threshold is a module constant
#   (metrics.DEFAULT_STALE_LOCK_AGE_SECONDS) rather than a config key.
# ---------------------------------------------------------------------------
