# /etc/tmpfiles.d/pi-test-tmp.conf
# Host-level age-based cleanup for test/build churn directories in /tmp.
#
# Installed by the host operator (see docs/dev/host-hygiene.md). Complements
# the framework-level disk-backed TMPDIR + stale-root prune in run_tests.py /
# implement.py (SA-0MW2QED9M005FWOK).
#
# Age threshold: 2 days — safely above the measured worst-case full-suite
# run (~48 min) with comfortable margin.  See AC3 of SA-0MW2QEZBG009I3AI.
#
# Format: type path mode uid gid age   (see man tmpfiles.d(5))
#   e = adjust existing directories, clean their contents older than <age>
#   x = exclude path/glob from age-based cleanups (never removed)
#
# `e` cleans the *contents* of each matched directory (see the age-based
# cleanup semantics in man tmpfiles.d(5)): each direct child that is older
# than <age> is removed recursively, and the matched base directory itself
# is never removed.  `x` lines follow their glob so the exclusion wins for
# the active pytest-current symlink.
#
# Age-based cleanup runs as root via systemd-tmpfiles-clean.timer on every
# host (see docs/dev/host-hygiene.md); unprivileged --dry-run cannot clean
# these patterns (systemd restricts non-root age cleaning of custom
# subdirectories), so verify as root.

# ── pytest test roots ────────────────────────────────────────────────────
# Clean old individual pytest-of-<user>/pytest-* roots (the observed inode
# hog: hundreds of files per root).  The pytest-of-* glob covers every
# user on the host (system scope runs as root, so %u would wrongly expand
# to "root").  The base dirs themselves are kept — only aged children are
# removed.
e /tmp/pytest-of-* - - - 2d

# Never remove the active (newest) pytest root symlink.  Exclusion rules
# (`x`) override age-based cleanup for matching paths, so pytest-current is
# kept even though it matches the e glob above.
x /tmp/pytest-of-*/pytest-current

# ── Playwright browser profiles ──────────────────────────────────────────
# Playwright writes random-named top-level dirs directly in /tmp; clean
# their (potentially huge) contents when older than 2 days.  The shell
# dirs remain and are swept later by the stock 10-day /tmp rule — the
# inode win here is the hundreds of files per stale profile.
e /tmp/playwright-* - - - 2d

# ── Chromium / Chrome per-user profile dirs ──────────────────────────────
e /tmp/.org.chromium.Chromium.* - - - 2d
e /tmp/.com.google.Chrome.* - - - 2d

# ── Build / compile caches ───────────────────────────────────────────────
e /tmp/tsx-* - - - 2d
e /tmp/node-compile-cache* - - - 2d
e /tmp/v8-compile-cache* - - - 2d
