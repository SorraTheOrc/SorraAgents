[pytest]
markers =
    smoke: fast, high-confidence tests run on every push to dev
    critical: essential validation tests that must always pass
    benchmark: real-model performance benchmarks that require an idle local proxy (opt-in via AUDIT_RUN_BENCHMARKS=1)

# The accidental nested skill/skill/ artefact (an absolute symlink plus an
# empty package marker) once duplicated every skill/shared test under a second
# node id and, inside a git worktree, resolved to the MAIN checkout's stale
# copy. It was removed in LP-0MUHOHP82006NT3W and is guarded against
# reintroduction by .gitignore, so the interim --ignore=skill/skill mitigation
# (LP-0MUESDZVW006YJ1N) is no longer needed and was removed here. Regression
# coverage: tests/test_nested_skill_skill_guard.py.
