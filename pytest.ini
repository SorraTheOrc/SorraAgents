[pytest]
markers =
    smoke: fast, high-confidence tests run on every push to dev
    critical: essential validation tests that must always pass
    benchmark: real-model performance benchmarks that require an idle local proxy (opt-in via AUDIT_RUN_BENCHMARKS=1)

# skill/skill/shared is a committed absolute symlink to the installed skills
# directory (~/.pi/agent/skills/shared -> the main checkout's skill/shared).
# Collecting it duplicates every skill/shared test under a second node id and,
# inside a git worktree, the symlink resolves to the MAIN checkout's copy — so
# a worktree-only edit to skill/shared is tested twice against two different
# revisions (LP-0MUESDZVW006YJ1N). skill/skill/ holds no tests of its own.
addopts = --ignore=skill/skill
